# Configurația panoului de administrare online (Decap CMS).
# Editează produsele și pachetele direct în products.json / packages.json,
# aceleași fișiere folosite de site și de panoul local (admin.bat).

backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Actualizare {{collection}} (din panoul online)'
    uploadMedia: 'Poză nouă: {{path}}'
    deleteMedia: 'Poză ștearsă: {{path}}'

locale: 'ro'

# unde ajung pozele urcate din panou
media_folder: 'images/produse/incarcate'
public_folder: 'images/produse/incarcate'

publish_mode: simple

collections:
  # ---------------- PRODUSE ----------------
  - name: 'produse'
    label: 'Produse'
    files:
      - name: 'lista'
        label: 'Lista de produse'
        file: 'products.json'
        description: 'Toate produsele care apar pe site, grupate pe categorii.'
        fields:
          - name: 'produse'
            label: 'Produse'
            label_singular: 'Produs'
            widget: 'list'
            summary: '{{fields.nume}} — {{fields.pret}}'
            fields:
              - name: 'nume'
                label: 'Nume produs'
                widget: 'string'

              - name: 'id'
                label: 'Identificator (se completează o singură dată, fără spații)'
                widget: 'string'
                hint: 'Exemplu: prosop-mare. Nu îl mai schimba după ce ai salvat.'

              - name: 'categorie'
                label: 'Categorie'
                widget: 'select'
                options:
                  - { label: 'Accesorii', value: 'accesorii' }
                  - { label: 'Coroane', value: 'coroane' }
                  - { label: 'Felinare', value: 'felinare' }
                  - { label: 'Îmbrăcăminte', value: 'imbracaminte' }
                  - { label: 'Lenjerii', value: 'lenjerii' }
                  - { label: 'Prosoape', value: 'prosoape' }
                  - { label: 'Sicrie', value: 'sicrie' }
                  - { label: 'Veselă', value: 'vesela' }

              - name: 'subcategorie'
                label: 'Subcategorie'
                widget: 'select'
                required: false
                default: ''
                hint: 'Se folosește doar la Sicrie, Prosoape, Lenjerii și Veselă. Lasă gol în rest.'
                options:
                  - { label: '— fără —', value: '' }
                  - { label: 'Sicrie: Premium', value: 'premium' }
                  - { label: 'Sicrie: Clasic', value: 'clasic' }
                  - { label: 'Prosoape: Mici', value: 'mici' }
                  - { label: 'Prosoape: Medii', value: 'medii' }
                  - { label: 'Prosoape: Mari', value: 'mari' }
                  - { label: 'Lenjerii: Lenjerii de pat', value: 'lenjerii-pat' }
                  - { label: 'Lenjerii: Plăpumi', value: 'plapumi' }
                  - { label: 'Veselă: Pahare', value: 'pahare' }
                  - { label: 'Veselă: Căni', value: 'cani' }
                  - { label: 'Veselă: Farfurii', value: 'farfurii' }
                  - { label: 'Veselă: Boluri', value: 'boluri' }
                  - { label: 'Veselă: Vas Iena', value: 'vas-iena' }
                  - { label: 'Veselă: Oale', value: 'oale' }

              - name: 'pret'
                label: 'Preț'
                widget: 'string'
                required: false
                default: ''
                hint: 'Scrie și moneda. Exemplu: 150 RON'

              - name: 'stoc'
                label: 'Stoc'
                widget: 'select'
                default: 'in_stoc'
                options:
                  - { label: 'În stoc', value: 'in_stoc' }
                  - { label: 'Cantitate limitată', value: 'limitat' }
                  - { label: 'Stoc epuizat (nu apare pe site)', value: 'epuizat' }

              - name: 'material'
                label: 'Material'
                widget: 'string'
                required: false
                default: ''

              - name: 'dimensiuni'
                label: 'Dimensiuni'
                widget: 'string'
                required: false
                default: ''

              - name: 'descriere'
                label: 'Descriere'
                widget: 'text'
                required: false
                default: ''

              - name: 'imagini'
                label: 'Poze'
                label_singular: 'Poză'
                widget: 'list'
                required: false
                default: []
                hint: 'Cel mai bine arată pozele pătrate. Poți adăuga mai multe.'
                field:
                  name: 'poza'
                  label: 'Poză'
                  widget: 'image'

  # ---------------- PACHETE ----------------
  - name: 'pachete'
    label: 'Pachete funerare'
    files:
      - name: 'lista'
        label: 'Lista de pachete'
        file: 'packages.json'
        description: 'Pachetele funerare afișate pe site.'
        fields:
          - name: 'pachete'
            label: 'Pachete'
            label_singular: 'Pachet'
            widget: 'list'
            summary: '{{fields.nume}} — {{fields.pret}}'
            fields:
              - name: 'nume'
                label: 'Nume pachet'
                widget: 'string'

              - name: 'id'
                label: 'Identificator (fără spații)'
                widget: 'string'
                hint: 'Exemplu: pachet-10000'

              - name: 'pret'
                label: 'Preț'
                widget: 'string'
                required: false
                default: ''
                hint: 'Exemplu: 10000 RON'

              - name: 'eticheta'
                label: 'Etichetă specială'
                widget: 'string'
                required: false
                default: ''
                hint: 'Exemplu: Cel mai complet. Lasă gol dacă nu vrei etichetă.'

              - name: 'itemi'
                label: 'Ce conține pachetul'
                label_singular: 'Element'
                widget: 'list'
                required: false
                default: []
                field:
                  name: 'element'
                  label: 'Element'
                  widget: 'string'

              - name: 'descriere'
                label: 'Descriere'
                widget: 'text'
                required: false
                default: ''
