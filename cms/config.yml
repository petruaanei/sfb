# Configurația panoului de administrare online (Decap CMS).
# Editează products.json și packages.json — aceleași fișiere folosite de site
# și de panoul local (admin.bat).

backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: 'Actualizare {{collection}} (din panoul online)'
    uploadMedia: 'Poză nouă: {{path}}'
    deleteMedia: 'Poză ștearsă: {{path}}'

locale: 'ro'

# unde ajung pozele urcate din panou
media_folder: 'images/produse/incarcate'
public_folder: 'images/produse/incarcate'

publish_mode: simple

collections:
  # ---------------- PRODUSE ----------------
  - name: 'produse'
    label: 'Produse'
    editor:
      preview: false
    files:
      - name: 'lista'
        label: 'Toate produsele'
        file: 'products.json'
        description: >-
          Apasă pe un produs ca să îl modifici, sau pe „Add Produs" (jos de tot)
          ca să adaugi unul nou. La final, apasă Publish sus în dreapta.
        fields:
          - name: 'produse'
            label: 'Produse'
            label_singular: 'Produs'
            widget: 'list'
            collapsed: true
            summary: '{{fields.nume}}   —   cod {{fields.cod}}   ·   {{fields.categorie}}   ·   {{fields.pret}} RON'
            fields:
              - name: 'nume'
                label: 'Numele produsului'
                widget: 'string'
                hint: 'Așa va apărea pe site. Exemplu: Prosop Mare'

              - name: 'cod'
                label: 'Cod produs'
                widget: 'string'
                required: false
                default: ''
                hint: 'Numărul tău din catalog. Apare pe site, sub numele produsului. Exemplu: 1'

              - name: 'imagini'
                label: 'Poze'
                label_singular: 'Poză'
                widget: 'list'
                required: false
                default: []
                collapsed: false
                hint: 'Prima poză este cea care apare în listă. Cel mai bine arată pozele pătrate.'
                field:
                  name: 'poza'
                  label: 'Poză'
                  widget: 'image'

              - name: 'pret'
                label: 'Preț (RON)'
                widget: 'number'
                required: false
                value_type: 'float'
                min: 0
                hint: 'Scrie doar cifra. „RON” se adaugă automat pe site.'

              - name: 'categorie'
                label: 'Categorie'
                widget: 'select'
                options:
                  - { label: 'Accesorii', value: 'accesorii' }
                  - { label: 'Cavouri', value: 'cavouri' }
                  - { label: 'Coroane', value: 'coroane' }
                  - { label: 'Felinare', value: 'felinare' }
                  - { label: 'Îmbrăcăminte', value: 'imbracaminte' }
                  - { label: 'Lenjerii', value: 'lenjerii' }
                  - { label: 'Meniu mâncare', value: 'meniu-mancare' }
                  - { label: 'Prosoape', value: 'prosoape' }
                  - { label: 'Sicrie', value: 'sicrie' }
                  - { label: 'Veselă', value: 'vesela' }

              - name: 'stoc'
                label: 'Stoc'
                widget: 'select'
                default: 'in_stoc'
                hint: 'Dacă alegi „Stoc epuizat", produsul dispare de pe site, dar rămâne salvat aici.'
                options:
                  - { label: 'În stoc', value: 'in_stoc' }
                  - { label: 'Cantitate limitată', value: 'limitat' }
                  - { label: 'Stoc epuizat — nu apare pe site', value: 'epuizat' }

              - name: 'subcategorie'
                label: 'Subcategorie'
                widget: 'select'
                required: false
                default: ''
                hint: 'Se completează DOAR la Sicrie, Prosoape, Lenjerii și Veselă. În rest, lasă „— fără —".'
                options:
                  - { label: '— fără —', value: '' }
                  - { label: 'Sicrie · Premium', value: 'premium' }
                  - { label: 'Sicrie · Clasic', value: 'clasic' }
                  - { label: 'Prosoape · Mici', value: 'mici' }
                  - { label: 'Prosoape · Medii', value: 'medii' }
                  - { label: 'Prosoape · Mari', value: 'mari' }
                  - { label: 'Lenjerii · Lenjerii de pat', value: 'lenjerii-pat' }
                  - { label: 'Lenjerii · Plăpumi', value: 'plapumi' }
                  - { label: 'Veselă · Pahare', value: 'pahare' }
                  - { label: 'Veselă · Căni', value: 'cani' }
                  - { label: 'Veselă · Farfurii', value: 'farfurii' }
                  - { label: 'Veselă · Boluri', value: 'boluri' }
                  - { label: 'Veselă · Vas Iena', value: 'vas-iena' }
                  - { label: 'Veselă · Oale', value: 'oale' }

              - name: 'material'
                label: 'Material'
                widget: 'string'
                required: false
                default: ''
                hint: 'Opțional. Exemplu: Bumbac 100%'

              - name: 'dimensiuni'
                label: 'Dimensiuni'
                widget: 'string'
                required: false
                default: ''
                hint: 'Opțional. Exemplu: 70x140 cm'

              - name: 'descriere'
                label: 'Descriere'
                widget: 'text'
                required: false
                default: ''
                hint: 'Opțional. Câteva cuvinte despre produs.'

              - name: 'id'
                label: 'Cod intern'
                widget: 'hidden'
                required: false
                default: ''

  # ---------------- PACHETE ----------------
  - name: 'pachete'
    label: 'Pachete funerare'
    editor:
      preview: false
    files:
      - name: 'lista'
        label: 'Toate pachetele'
        file: 'packages.json'
        description: >-
          Apasă pe un pachet ca să îl modifici. La final, apasă Publish sus în dreapta.
        fields:
          - name: 'pachete'
            label: 'Pachete'
            label_singular: 'Pachet'
            widget: 'list'
            collapsed: true
            summary: '{{fields.nume}}  ·  {{fields.pret}} RON'
            fields:
              - name: 'nume'
                label: 'Numele pachetului'
                widget: 'string'
                hint: 'Exemplu: Pachet Funerar 10.000'

              - name: 'pret'
                label: 'Preț (RON)'
                widget: 'number'
                required: false
                value_type: 'float'
                min: 0
                hint: 'Scrie doar cifra. „RON” se adaugă automat pe site.'

              - name: 'itemi'
                label: 'Ce conține pachetul'
                label_singular: 'Element'
                widget: 'list'
                required: false
                default: []
                collapsed: false
                hint: 'Câte un element pe rând. Apar pe site ca listă cu bifă.'
                field:
                  name: 'element'
                  label: 'Element'
                  widget: 'string'

              - name: 'descriere'
                label: 'Descriere'
                widget: 'text'
                required: false
                default: ''

              - name: 'eticheta'
                label: 'Etichetă specială'
                widget: 'string'
                required: false
                default: ''
                hint: 'Opțional. Exemplu: Cel mai complet. Lasă gol dacă nu vrei etichetă.'

              - name: 'id'
                label: 'Cod intern'
                widget: 'hidden'
                required: false
                default: ''
