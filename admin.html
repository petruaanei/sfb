<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panou Admin — Servicii Funerare Băltătești</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-marca">
        <img src="images/logo.png" alt="" class="admin-logo">
        <div>
          <span class="admin-eticheta">Panou de administrare</span>
          <h1>Produse și pachete</h1>
        </div>
      </div>

      <div class="admin-header-actiuni">
        <a href="index.html" target="_blank" class="buton-linie">Vezi site-ul</a>
        <button type="button" class="buton-publica" id="butonPublica">
          <span id="publicaText">Publică pe site</span>
        </button>
      </div>
    </div>
  </header>

  <div class="publica-bara" id="publicaBara">
    <div class="publica-bara-inner">
      <span class="publica-punct"></span>
      <span id="publicaStare"></span>
    </div>
  </div>

  <main id="app"></main>

  <script src="admin.js"></script>
</body>
</html>
