<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produse - Site Proiect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <ul class="nav-links nav-links-left">
        <li><a href="index.html">Acasă</a></li>
        <li><a href="servicii.html">Servicii</a></li>
        <li><a href="produse.html" class="active">Produse</a></li>
      </ul>
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Logo firmă" class="logo-img">
      </a>
      <ul class="nav-links nav-links-right">
        <li><a href="pachete.html">Pachete funerare</a></li>
        <li><a href="despre.html">Despre noi</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="produse">
      <div class="produse-filtre" id="produseFiltre">
      <div class="filtre-rand">
      <nav class="categorii-nav">
        <button type="button" class="categorie-btn" data-categorie="toate">Toate</button>
        <button type="button" class="categorie-btn" data-categorie="accesorii">Accesorii</button>
        <button type="button" class="categorie-btn" data-categorie="cavouri">Cavouri</button>
        <button type="button" class="categorie-btn" data-categorie="coroane">Coroane</button>
        <button type="button" class="categorie-btn" data-categorie="felinare">Felinare</button>
        <button type="button" class="categorie-btn" data-categorie="imbracaminte">Îmbrăcăminte</button>
        <button type="button" class="categorie-btn" data-categorie="lenjerii">Lenjerii</button>
        <button type="button" class="categorie-btn" data-categorie="meniu-mancare">Meniu mâncare</button>
        <button type="button" class="categorie-btn" data-categorie="prosoape">Prosoape</button>
        <button type="button" class="categorie-btn" data-categorie="sicrie">Sicrie</button>
        <button type="button" class="categorie-btn" data-categorie="vesela">Veselă</button>
      </nav>

      <div class="produse-search" id="produseSearch">
        <button type="button" class="cautare-toggle" id="cautareToggle" aria-label="Caută un produs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <input type="text" id="cautareProdus" placeholder="Caută un produs după nume..." autocomplete="off">
        <div class="cautare-rezultate" id="cautareRezultate"></div>
      </div>
      </div>

      <!-- Subcategoriile apar aici automat, când alegi o categorie care are subcategorii -->
      <div class="subcategorii-nav" id="subcategoriiNav"></div>
      </div>

      <!-- Cardurile de produse sunt generate automat din products.json -->
      <section id="accesorii" class="categorie">
        <h2>Accesorii</h2>
        <div class="produse-grid" data-categorie="accesorii"></div>
      </section>

      <section id="cavouri" class="categorie">
        <h2>Cavouri</h2>
        <div class="produse-grid" data-categorie="cavouri"></div>
      </section>

      <section id="coroane" class="categorie">
        <h2>Coroane</h2>
        <div class="produse-grid" data-categorie="coroane"></div>
      </section>

      <section id="felinare" class="categorie">
        <h2>Felinare</h2>
        <div class="produse-grid" data-categorie="felinare"></div>
      </section>

      <section id="imbracaminte" class="categorie">
        <h2>Îmbrăcăminte</h2>
        <div class="produse-grid" data-categorie="imbracaminte"></div>
      </section>

      <section id="lenjerii" class="categorie">
        <h2>Lenjerii</h2>
        <div class="subcategorii-wrap" data-categorie="lenjerii"></div>
      </section>

      <section id="meniu-mancare" class="categorie">
        <h2>Meniu mâncare</h2>
        <div class="produse-grid" data-categorie="meniu-mancare"></div>
      </section>

      <section id="prosoape" class="categorie">
        <h2>Prosoape</h2>
        <div class="subcategorii-wrap" data-categorie="prosoape"></div>
      </section>

      <section id="sicrie" class="categorie">
        <h2>Sicrie</h2>
        <div class="subcategorii-wrap" data-categorie="sicrie"></div>
      </section>

      <section id="vesela" class="categorie">
        <h2>Veselă</h2>
        <div class="subcategorii-wrap" data-categorie="vesela"></div>
      </section>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Servicii Funerare Băltătești. Toate drepturile rezervate.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
