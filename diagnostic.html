<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0b0d; color: #eee; padding: 1.2rem; line-height: 1.6; }
    h1 { font-size: 1.2rem; color: #d9ac45; margin-bottom: 1rem; }
    .rand { padding: 0.6rem 0; border-bottom: 1px solid #2a2a2e; }
    .eticheta { color: #999; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
    .val { font-size: 1rem; word-break: break-all; }
    .ok { color: #7fb886; }
    .rau { color: #e0645a; }
    pre { background: #16161a; padding: 0.8rem; overflow-x: auto; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Diagnostic — ce vede acest dispozitiv</h1>
  <div id="rez">Se verifică...</div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    const erori = [];
    window.addEventListener("error", (e) => erori.push(e.message));

    function rand(eticheta, valoare, bun) {
      const cls = bun === undefined ? "" : bun ? "ok" : "rau";
      return `<div class="rand"><div class="eticheta">${eticheta}</div>
              <div class="val ${cls}">${valoare}</div></div>`;
    }

    setTimeout(() => {
      let out = "";

      out += rand("Adresa folosită", window.location.origin);

      const areProducts = typeof PRODUCTS !== "undefined";
      out += rand("products.js încărcat", areProducts ? "DA" : "NU", areProducts);

      if (areProducts) {
        out += rand("Număr de produse găsite", PRODUCTS.length, PRODUCTS.length === 9);
        out += rand("Lista", PRODUCTS.map((p) => p.nume).join(", "));
      }

      const areScript = typeof VERSIUNE_SCRIPT !== "undefined";
      out += rand(
        "script.js este versiunea nouă",
        areScript ? VERSIUNE_SCRIPT : "NU — browserul are o copie VECHE salvată",
        areScript
      );

      const areFiltre = typeof initCategoriiNav === "function";
      out += rand("Funcția de filtrare există", areFiltre ? "DA" : "NU", areFiltre);

      out += rand("Erori JavaScript", erori.length ? erori.join(" | ") : "niciuna", erori.length === 0);

      document.getElementById("rez").innerHTML = out;
    }, 600);
  </script>
</body>
</html>
